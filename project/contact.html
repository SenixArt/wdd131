<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Mundo Creativo for course inquiries and collaboration.">
    <title>Mundo Creativo | Contact Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/contact.js" defer></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <h2>Mundo Creativo</h2>
        </div>
        <button id="menu-toggle" aria-label="Toggle Navigation">☰</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-main">
        <h1>Contact & Support</h1>
        <p>Fill out the form below to register interest or ask questions.</p>

        <form id="contact-form" method="get" action="contact.html">
            <label for="fullname">Full Name <span class="required">*</span></label>
            <input type="text" id="fullname" name="fullname" required placeholder="John Doe">

            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required placeholder="example@domain.com">

            <label for="subject">Inquiry Subject <span class="required">*</span></label>
            <select id="subject" name="subject" required>
                <option value="" disabled selected>Select a Topic...</option>
                <option value="courses">Course Information</option>
                <option value="support">Technical Support</option>
                <option value="business">Business Collaboration</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>

            <input type="submit" value="Send Message" class="submit-btn">
        </form>

        <div id="feedback-message" class="hidden"></div>
        
        <div class="stats-box">
            <p>Total inquiries sent from this browser: <strong id="inquiry-count">0</strong></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 | Daniel Cosme | Zulia, Venezuela</p>
        <p><a href="siteplan.html">Site Plan</a> | <a href="references.html">References</a></p>
    </footer>
</body>
</html>
