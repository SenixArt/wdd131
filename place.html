<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Falls, Venezuela</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Salto Ángel - Venezuela</h1>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source srcset="images/angel-large.webp" media="(min-width: 768px)">
                <img src="images/angel-small.webp" alt="Salto Angel Waterfall" width="500" height="250">
            </picture>
        </div>

        <div class="grid">
            <section class="card">
                <h2>Data</h2>
                <p><strong>Location:</strong> Bolívar, Venezuela</p>
                <p><strong>Park:</strong> Canaima National Park</p>
                <p><strong>Height:</strong> 979 meters</p>
                <p><strong>Type:</strong> Waterfall</p>
                <p><strong>Language:</strong> Spanish</p>
                <p><strong>Currency:</strong> Bolívar</p>
            </section>

            <section class="card">
                <h2>Weather</h2>
                <div class="weather-icon">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="#f1c40f">
                        <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0z"/>
                    </svg>
                </div>
                <p><strong>Temp:</strong> 10 °C</p>
                <p><strong>Conditions:</strong> Partly Cloudy</p>
                <p><strong>Wind:</strong> 10 km/h</p>
                <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> - Daniel Cosme - Venezuela</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
